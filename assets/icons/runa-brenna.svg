<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Runa de proteção: trísquele céltico sobre pedra, com marcas de ogam na borda. -->
  <defs>
    <radialGradient id="pedra" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#3a3430"/>
      <stop offset="100%" stop-color="#14100e"/>
    </radialGradient>
    <filter id="brilho" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="50" cy="50" r="47" fill="url(#pedra)" stroke="#6fcfc0" stroke-width="2.5"/>
  <circle cx="50" cy="50" r="40" fill="none" stroke="#6fcfc0" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
  <!-- Ogam: traços curtos em volta, como entalhes numa pedra de marco. -->
  <g stroke="#6fcfc0" stroke-width="2" stroke-linecap="round" opacity="0.8">
    <line x1="50" y1="5" x2="50" y2="11"/><line x1="56" y1="6" x2="55.3" y2="11.5"/>
    <line x1="44" y1="6" x2="44.7" y2="11.5"/><line x1="89" y1="47" x2="95" y2="47"/>
    <line x1="88.5" y1="53" x2="94.5" y2="53.5"/><line x1="11" y1="50" x2="5" y2="50"/>
    <line x1="50" y1="89" x2="50" y2="95"/><line x1="27" y1="85" x2="24" y2="90"/>
    <line x1="73" y1="85" x2="76" y2="90"/>
  </g>
  <!-- Trísquele: três espirais saindo do centro. -->
  <g fill="none" stroke="#a8f5ea" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#brilho)">
    <path id="braco" d="M50 50 C 50 37, 61 28, 71 33 C 80 38, 79 51, 70 54 C 63 56, 58 50, 61 45 C 63 42, 67 43, 67 46"/>
    <use href="#braco" transform="rotate(120 50 50)"/>
    <use href="#braco" transform="rotate(240 50 50)"/>
  </g>
  <circle cx="50" cy="50" r="3.2" fill="#a8f5ea"/>
</svg>
